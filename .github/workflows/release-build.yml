name: Build and attach release assets

# Dieser Workflow läuft, wenn ein Release veröffentlicht wird.
# Er baut die Go-Binärdatei für Linux, Windows und macOS (amd64)
# und hängt die gebauten Binärdateien an das Release an.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    # Wir verwenden einen Matrix-Job, um auf unterschiedlichen Runnern zu bauen
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            goos: linux
            extension: ""
          - os: windows
            runner: windows-latest
            goos: windows
            extension: .exe
          - os: macos
            runner: macos-latest
            goos: darwin
            extension: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          # Verwende dieselbe Go-Version wie in go.mod
          go-version: 1.21.3

      - name: Build binary
        # Verwende Bash, damit mkdir -p plattformübergreifend funktioniert
        shell: bash
        run: |
          echo "Building for ${{ matrix.os }} (GOOS=${{ matrix.goos }})"
          mkdir -p dist
          GOOS=${{ matrix.goos }} GOARCH=amd64 go build -o dist/aoc-cli_${{ matrix.os }}_amd64${{ matrix.extension }} .

      - name: Upload to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: dist/aoc-cli_${{ matrix.os }}_amd64${{ matrix.extension }}
          asset_name: aoc-cli_${{ matrix.os }}_amd64${{ matrix.extension }}
          asset_content_type: application/octet-stream
